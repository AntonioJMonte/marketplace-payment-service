services:
  payment-db:
    image: postgres:15
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - "payment_db_data:/var/lib/postgresql/data"
    networks:
      - payment-network

volumes:
  payment_db_data:

networks:
  payment-network:
    driver: bridge